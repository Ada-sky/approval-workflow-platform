# Dedicated future execution target. Stage 1 never connects or runs migrations.
spring:
  datasource:
    url: 'jdbc:mysql://127.0.0.1:3307/hpoa_flyway_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai'
    username: hpoa_flyway_test
    password: ${FLYWAY_TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      jdbc-url: 'jdbc:mysql://127.0.0.1:3307/hpoa_flyway_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai'
      username: hpoa_flyway_test
      password: ${FLYWAY_TEST_DB_PASSWORD}
      pool-name: FlywayTestHikari
  flyway:
    enabled: true
    locations: classpath:db/migration/application
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.schema-generation.database.action: none
