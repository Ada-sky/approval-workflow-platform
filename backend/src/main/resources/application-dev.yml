# Normal local development. Initialization and seeding are separate explicit operations.
server:
  address: 127.0.0.1
  port: 8080
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      jdbc-url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration/application
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.schema-generation.database.action: none
  activiti:
    database-schema-update: false
    db-history-used: true
    history-level: full
    check-process-definitions: false
    async-executor-activate: false
    process-definition-location-prefix: classpath:/bpmn/
    process-definition-location-suffixes:
      - hr_employee_holiday.bpmn
