server:
  address: 127.0.0.1
  port: 8081
context:
  initializer:
    classes: stage2.Stage2SafetyInitializer
spring:
  datasource:
    url: 'jdbc:mysql://127.0.0.1:3307/hpoa_migration_stage2?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai'
    username: hpoa_stage2
    password: ${STAGE2_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      jdbc-url: 'jdbc:mysql://127.0.0.1:3307/hpoa_migration_stage2?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai'
      username: hpoa_stage2
      password: ${STAGE2_DB_PASSWORD}
      pool-name: Stage2CloneHikari
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.schema-generation.database.action: none
  activiti:
    database-schema-update: 'true'
    db-history-used: true
    history-level: full
    async-executor-activate: false
    check-process-definitions: true
    process-definition-location-prefix: classpath:/bpmn/
    process-definition-location-suffixes:
      - hr_employee_holiday.bpmn
    deployment-mode: default
