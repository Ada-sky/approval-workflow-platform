# One-time initialization only; never use this profile for normal development.
server:
  address: 127.0.0.1
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hpoa_dev
    username: hpoa_dev
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      jdbc-url: jdbc:mysql://127.0.0.1:3306/hpoa_dev
      username: hpoa_dev
      password: ${DEV_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration/application
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.schema-generation.database.action: none
  activiti:
    database-schema-update: true
    db-history-used: true
    history-level: full
    check-process-definitions: true
    async-executor-activate: false
    process-definition-location-prefix: classpath:/bpmn/
    process-definition-location-suffixes:
      - hr_employee_holiday.bpmn
