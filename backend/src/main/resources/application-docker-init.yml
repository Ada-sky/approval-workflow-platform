server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${DOCKER_COOKIE_SECURE:false}
spring:
  datasource:
    url: jdbc:mysql://db:3306/hpoa_docker
    username: hpoa_docker
    password: ${DOCKER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      jdbc-url: jdbc:mysql://db:3306/hpoa_docker
      username: hpoa_docker
      password: ${DOCKER_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration/application
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.schema-generation.database.action: none
  activiti:
    database-schema-update: true
    check-process-definitions: true
    db-history-used: true
    history-level: full
    async-executor-activate: false
    process-definition-location-prefix: classpath:/bpmn/
    process-definition-location-suffixes:
      - hr_employee_holiday.bpmn
